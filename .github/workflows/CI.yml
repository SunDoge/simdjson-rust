name: CI
on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  Test:
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Reserve macOS minutes for master and explicit manual runs.
        os: ${{ fromJSON((github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/master')) && '["ubuntu-22.04", "windows-2022", "macos-15"]' || '["ubuntu-22.04", "windows-2022"]') }}
        rust:
          - "stable"
        cpp:
          - llvm
        include:
          - os: ubuntu-22.04
            rust: stable
            cpp: gcc
          - os: windows-2022
            rust: stable
            cpp: msvc

    steps:
      - uses: actions/checkout@v7

      # Setup compilers and tools

      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: ${{ matrix.rust }}
          components: rustfmt, clippy
          cache-key: ${{ matrix.os }}-${{ matrix.cpp }}
          rustflags: ""

      - name: Select Unix C++ compiler
        if: runner.os != 'Windows'
        shell: bash
        run: |
          if [[ '${{ matrix.cpp }}' == 'gcc' ]]; then
            echo "CC=gcc" >> "$GITHUB_ENV"
            echo "CXX=g++" >> "$GITHUB_ENV"
          elif [[ "$RUNNER_OS" == 'macOS' ]]; then
            llvm_bin="$(brew --prefix llvm@18)/bin"
            echo "CC=$llvm_bin/clang" >> "$GITHUB_ENV"
            echo "CXX=$llvm_bin/clang++" >> "$GITHUB_ENV"
          else
            echo "CC=clang" >> "$GITHUB_ENV"
            echo "CXX=clang++" >> "$GITHUB_ENV"
          fi

      - name: Configure Visual Studio environment
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $before = @{}
          Get-ChildItem Env: | ForEach-Object { $before[$_.Name] = $_.Value }
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vsPath = & $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $vsPath) { throw 'Visual Studio C++ tools were not found' }
          Import-Module "$vsPath\Common7\Tools\Microsoft.VisualStudio.DevShell.dll"
          Enter-VsDevShell -VsInstallPath $vsPath -SkipAutomaticLocation -DevCmdArguments '-arch=x64 -host_arch=x64'
          Get-ChildItem Env: | Where-Object { $before[$_.Name] -ne $_.Value } | ForEach-Object {
            "$($_.Name)=$($_.Value)" >> $env:GITHUB_ENV
          }

      # Rust's Windows target uses the MSVC ABI. Use LLVM's matching driver
      # for both CMake and the cxx bridge, rather than clang++.
      - name: Configure Windows LLVM
        if: runner.os == 'Windows' && matrix.cpp == 'llvm'
        shell: pwsh
        run: |
          $clang = "$env:ProgramFiles\LLVM\bin\clang-cl.exe"
          if (-not (Test-Path $clang)) { throw 'clang-cl was not found' }
          "CC=$clang" >> $env:GITHUB_ENV
          "CXX=$clang" >> $env:GITHUB_ENV
          "CMAKE_GENERATOR=Ninja" >> $env:GITHUB_ENV

      # Tests also build the workspace.

      - name: Test
        run: cargo test --workspace --all-targets --all-features

      - name: Test maintenance scripts
        if: matrix.os == 'ubuntu-22.04' && matrix.cpp == 'gcc'
        run: python3 -m unittest discover -s scripts/tests -v

      - name: Check optional features and release packages
        if: matrix.os == 'ubuntu-22.04' && matrix.cpp == 'gcc'
        run: |
          cargo test --workspace --no-default-features --all-targets
          cargo test --workspace --doc
          cargo publish --dry-run --workspace

  MSRV:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: "1.88.0"
          cache-key: msrv
          rustflags: ""
      - run: cargo check --workspace --all-targets --all-features
