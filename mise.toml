[tools]
cargo-release = "latest"
cocogitto = "6.5.0"
fd = "latest"

[tasks.copy-compile-commands]
description = "Copy the C++ compilation database into simdjson-sys"
run = "fd -IH compile_commands target/ -x cp {} simdjson-sys/"

# Copy .cargo/config.toml.example to .cargo/config.toml to tune Rust as well.
[tasks.bench]
description = "Run parser benchmarks tuned for the local CPU"
run = "cargo bench --bench parser_bench --features native"

[tasks.setup-hooks]
description = "Install the local commit message validation hook"
run = "cog install-hook commit-msg"

[tasks.check-commits]
description = "Validate commits made after Conventional Commits was introduced"
run = "cog check conventional-commits-start..HEAD"
