[package]
name = "simdjson-rust"
version = { workspace = true }
edition = "2024"
description = "Rust bindings for the simdjson project."
documentation = "https://docs.rs/simdjson-rust"
readme = "README.md"
homepage = "https://crates.io/crates/simdjson-rust"
repository = "https://github.com/SunDoge/simdjson-rust"
license = "Apache-2.0"
exclude = [".github/", "examples/"]

[workspace]
resolver = "2"
members = ["simdjson-sys"]

[workspace.package]
version = "0.3.0-alpha.3"

[workspace.dependencies]
simdjson-sys = { path = "simdjson-sys" }

[dependencies]
cxx = "1.0"
simdjson-sys = { workspace = true }

# serde compatibilty
serde = { version = "1", features = ["derive"], optional = true }
snafu = "0.9.1"

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }
serde_json = "1.0"
serde = { version = "1", features = ["derive"] }

[[bench]]
name = "parser_bench"
harness = false

[features]
default = ["serde"]

# serde compatibility
serde = ["dep:serde"]
