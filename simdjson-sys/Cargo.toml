[package]
name = "simdjson-sys"
version = { workspace = true }
rust-version = { workspace = true }
links = "simdjson"
edition = "2021"
description = "Low level Rust bindings for simdjson."
documentation = "https://docs.rs/simdjson-sys"
readme = "README.md"
homepage = "https://crates.io/crates/simdjson-sys"
repository = "https://github.com/SunDoge/simdjson-rust/tree/master/simdjson-sys"
license = "Apache-2.0"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html
include = ["src/**", "vendor/**", "build.rs", "CMakeLists.txt", "README.md", "LICENSE.txt"]

[dependencies]
cxx = "1.0.197"

[build-dependencies]
cmake = "0.1"
cxx-build = "1.0.197"

[features]
# Compile the bundled simdjson (and C++ bridge) with `-march=native` for the
# building machine (non-MSVC targets only). Off by default so published builds stay portable; enable
# locally for maximum speed on your own CPU.
default = []
native = []
