name: CI
on:
  pull_request:
  push:
    branches:
      - master

jobs:
  Test:
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-22.04
          - windows-2022
          - macos-15
        rust:
          - "stable"
        cpp:
          - llvm
        include:
          - os: ubuntu-22.04
            rust: stable
            cpp: gcc
          - os: windows-2022
            rust: stable
            cpp: msvc

    steps:
      - uses: actions/checkout@v6
        with:
          submodules: true

      # Cache
      - name: Cache
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/registry/src/
            ~/.cargo/git/db/
            target/
          key: "cache-v2-${{ matrix.os }}-${{ runner.arch }}-${{ matrix.rust }}-${{ matrix.cpp }}-${{ hashFiles('**/Cargo.toml', 'Cargo.lock', '**/build.rs', '**/CMakeLists.txt') }}"
          restore-keys: |
            cache-v2-${{ matrix.os }}-${{ runner.arch }}-${{ matrix.rust }}-${{ matrix.cpp }}-

      # Setup compilers and tools

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ matrix.rust }}
          components: rustfmt, clippy

      - name: Setup Cpp
        uses: aminya/setup-cpp@v1
        with:
          compiler: ${{ matrix.cpp }}
          vcvarsall: ${{ contains(matrix.os, 'windows') }}

      # Rust's Windows target uses the MSVC ABI. Use LLVM's matching driver
      # for both CMake and the cxx bridge, rather than clang++.
      - name: Configure Windows LLVM
        if: runner.os == 'Windows' && matrix.cpp == 'llvm'
        shell: pwsh
        run: |
          "CC=clang-cl" >> $env:GITHUB_ENV
          "CXX=clang-cl" >> $env:GITHUB_ENV
          "CMAKE_GENERATOR=Ninja" >> $env:GITHUB_ENV

      # Build and Test

      - name: Build
        run: cargo build --workspace --locked

      - name: Test
        run: cargo test --workspace --all-targets --locked
