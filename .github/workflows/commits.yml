name: Commits

on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: commits-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  conventional-commits:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check new commits
        uses: cocogitto/cocogitto-action@v4.1.0
        with:
          command: check
          args: conventional-commits-start..HEAD
